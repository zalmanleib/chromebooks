<script>
    function updateClock() {
      const now = new Date();
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const clockElement = document.getElementById('ambient-clock');
      if (clockElement) {
        clockElement.textContent = hours + ':' + minutes;
      }
      
      const dateElement = document.getElementById('live-date');
      if (dateElement) {
        const options = { weekday: 'long', month: 'long', day: 'numeric' };
        dateElement.textContent = now.toLocaleDateString('en-US', options);
      }
    }
    
    updateClock();
    setInterval(updateClock, 1000);

    const searchInput = document.getElementById('main-search-input');

    function runSearch() {
      if (!searchInput) return;
      const val = searchInput.value.trim();
      if (!val) return;
      if (val.startsWith('http://') || val.startsWith('https://') || (val.includes('.') && !val.includes(' '))) {
        window.location.href = val.startsWith('http') ? val : 'https://' + val;
      } else {
        window.location.href = 'https://www.google.com/search?q=' + encodeURIComponent(val);
      }
    }

    if (searchInput) {
      searchInput.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') runSearch();
      });
    }

    const searchSubmitBtn = document.getElementById('search-submit-btn');
    if (searchSubmitBtn) searchSubmitBtn.addEventListener('click', runSearch);

    const imageSearchBtn = document.getElementById('image-search-btn');
    if (imageSearchBtn) {
      imageSearchBtn.addEventListener('click', function() {
        window.location.href = 'https://images.google.com/';
      });
    }

    // Custom shortcuts (stored locally in this browser)
    function loadCustomShortcuts() {
      try {
        return JSON.parse(localStorage.getItem('customShortcuts') || '[]');
      } catch (e) {
        return [];
      }
    }

    function saveCustomShortcuts(shortcuts) {
      localStorage.setItem('customShortcuts', JSON.stringify(shortcuts));
    }

    function renderCustomShortcuts() {
      const addBtn = document.getElementById('add-shortcut-btn');
      if (!addBtn) return;
      document.querySelectorAll('.custom-shortcut').forEach(function(el) { el.remove(); });
      loadCustomShortcuts().forEach(function(shortcut, index) {
        const link = document.createElement('a');
        link.href = shortcut.url;
        link.className = 'custom-shortcut group flex flex-col items-center gap-space-xs text-center w-20 cursor-pointer';
        link.innerHTML =
          '<div class="relative w-14 h-14 rounded-2xl bg-surface-container-high/60 backdrop-blur-xl flex items-center justify-center shadow-md transition-all duration-300 group-hover:scale-105 group-hover:bg-surface-container-highest/80">' +
            '<img alt="" class="w-7 h-7 rounded" src="https://www.google.com/s2/favicons?sz=64&domain_url=' + encodeURIComponent(shortcut.url) + '"/>' +
            '<button aria-label="Remove shortcut" class="remove-shortcut-btn absolute -top-1.5 -right-1.5 w-5 h-5 rounded-full bg-error text-on-error text-[11px] leading-none flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity" data-index="' + index + '" type="button">&times;</button>' +
          '</div>' +
          '<span class="font-label-sm text-label-sm text-on-surface-variant group-hover:text-on-surface font-medium truncate max-w-full drop-shadow-sm transition-colors"></span>';
        link.querySelector('span').textContent = shortcut.name;
        link.querySelector('.remove-shortcut-btn').addEventListener('click', function(e) {
          e.preventDefault();
          e.stopPropagation();
          const shortcuts = loadCustomShortcuts();
          shortcuts.splice(index, 1);
          saveCustomShortcuts(shortcuts);
          renderCustomShortcuts();
        });
        addBtn.insertAdjacentElement('beforebegin', link);
      });
    }

    function addShortcut() {
      const name = window.prompt('Shortcut name:');
      if (!name) return;
      let url = window.prompt('Shortcut URL:');
      if (!url) return;
      url = url.trim();
      if (!/^https?:\/\//i.test(url)) url = 'https://' + url;
      const shortcuts = loadCustomShortcuts();
      shortcuts.push({ name: name.trim(), url: url });
      saveCustomShortcuts(shortcuts);
      renderCustomShortcuts();
    }

    const addShortcutBtn = document.getElementById('add-shortcut-btn');
    if (addShortcutBtn) addShortcutBtn.addEventListener('click', addShortcut);

    renderCustomShortcuts();
  </script>
